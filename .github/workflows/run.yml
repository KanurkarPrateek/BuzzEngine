# BuzzEngine runs here — no server, no Docker, no cost.
#
# Buffer is what makes this work as a plain scheduled job: there are no X
# credentials and no rotating refresh token, so the only state that has to
# survive between runs is the dedupe memory, which is committed back to the repo.
name: buzzengine

on:
  schedule:
    # Five attempts a day for three posts, so a run that finds nothing
    # publishable still leaves two spare slots. MAX_POSTS_PER_DAY is what caps
    # output; once three are out, later runs exit before any LLM call.
    # 09:30 / 13:30 / 17:30 / 21:30 / 01:30 IST.
    - cron: "0 4,8,12,16,20 * * *"
  # Manual trigger — the "Run workflow" button on the Actions tab.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — draft it but publish nothing"
        type: boolean
        default: true
      publish_now:
        description: "Publish straight to X instead of adding to Buffer's queue"
        type: boolean
        default: false
      ignore_cadence:
        description: "Ignore the daily cap and minimum spacing (for testing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: buzzengine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run one cycle
        env:
          # Manual runs default to dry; the schedule publishes.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          STATE_DIR: ./state
          LOG_FORMAT: json

          # Everything sensitive is a repository *secret*, never a variable:
          # GitHub masks secret values wherever they appear in logs, while
          # variables are stored and printed in plain text.
          PUBLISH_MODE: buffer
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}

          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'openai' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MAX_TOKENS: ${{ secrets.LLM_MAX_TOKENS || '8000' }}

          # Optional — the Reddit source stays silent without these, because
          # Reddit blocks unauthenticated JSON from datacenter IPs like Actions.
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}

          SOURCES: ${{ secrets.SOURCES || 'hn,github' }}
          TOPICS: ${{ secrets.TOPICS }}
          QUALITY_THRESHOLD: ${{ secrets.QUALITY_THRESHOLD || '7' }}

          # Manual-only overrides. `inputs.*` is empty on a scheduled run, so
          # every branch below falls through to the safe value automatically.
          # ignore_cadence has to lift BOTH limits — the daily cap alone would
          # still block a manual run once three posts have gone out.
          BUFFER_PUBLISH_NOW: ${{ inputs.publish_now && '1' || '0' }}
          MIN_MINUTES_BETWEEN_POSTS: ${{ inputs.ignore_cadence && '0' || '180' }}
          MAX_POSTS_PER_DAY: ${{ inputs.ignore_cadence && '99' || secrets.MAX_POSTS_PER_DAY || '3' }}
        run: node src/index.ts

      - name: Persist dedupe memory
        # Committing state back is what stops the bot re-posting the same story
        # on the next run — Actions gives each job a clean filesystem.
        if: always()
        run: |
          # The official GitHub Actions bot identity. Do not invent a name here:
          # an arbitrary one can collide with a real GitHub account, and that
          # person then shows up as a contributor to this repo.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json state/history.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no state changes"
          else
            git commit -m "chore: agent state [skip ci]"
            git push
          fi
